name: Build NX2Apple Shell
run-name: Build Shell (CPU BC decode)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout NX2Apple
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Homebrew deps
        run: brew install xcodegen zstd spirv-cross glslang dotnet

      - name: Install Python deps
        run: pip install lz4 capstone fonttools zbic nsz zstd

      - name: Sync engine
        run: python3 tools/engine.py sync 2>&1 | tail -20

      - name: Build shell (dummy framework)
        run: |
          set -e
          cd engine/dm/ios/tools
          
          # Create dummy framework directory for Mario Odyssey
          FW_DIR=$(mktemp -d)/DmGame0100000000010000.framework
          mkdir -p "$FW_DIR"
          
          cat > "$FW_DIR/game.manifest.json" << 'EOF'
          {"framework": "DmGame0100000000010000", "framework_executable": "DmGame0100000000010000", "title_id": "0100000000010000", "name": "Super Mario Odyssey", "loader": "FH"}
          EOF
          
          echo "dummy" > "$FW_DIR/DmGame0100000000010000"
          chmod +x "$FW_DIR/DmGame0100000000010000"
          
          export SHELL_DIR="$GITHUB_WORKSPACE/shell-build"
          export DM_SHELL_FRAMEWORKS="$FW_DIR"
          export DM_SHELL_NAME="NX2Apple"
          export DM_BUNDLE_ID="org.nxnative.shell"
          
          bash build_shell.sh --build 2>&1 | tee build.log

      - name: List build output
        run: ls -la shell-build/dd/Build/Products/Release-iphoneos/ 2>/dev/null || echo "no output dir"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NX2Apple-Shell
          path: shell-build/dd/Build/Products/Release-iphoneos/
          if-no-files-found: warn
